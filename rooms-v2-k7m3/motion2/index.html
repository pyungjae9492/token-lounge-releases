<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>서울 창밖 움직임 v2</title><style>body{margin:0;background:#0d0f14;color:#e8e6e1;font:15px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif}main{max-width:1100px;margin:0 auto;padding:24px 14px 80px}video{width:100%;display:block;border-radius:10px;margin:8px 0 6px;background:#000}h2{font-size:17px;margin:28px 0 0}.s{color:#9aa0aa;font-size:13px}</style></head><body><main><h1 style="font-size:21px">서울 창밖 움직임 v2: 구름을 별도 층으로</h1><p class="s">그림을 휘게 하던 방식을 없앴어요. 구름은 하늘에서 떼어 낸 별도 층이라 모양 그대로 통째로 흘러가고, 건물·산·나무는 움직이지 않아요. 한강만 잔물결과 반짝임이 있어요.</p><h2>구름 흐름 6배속</h2><div class="s">실제로는 10분에 한 바퀴 지나가는 느린 속도라, 확인용으로 빠르게 돌렸어요.</div><video src="seoul-lapse.mp4" poster="seoul-lapse.jpg" autoplay muted loop playsinline controls></video><h2>낮 (실제 속도)</h2><video src="seoul-day.mp4" poster="seoul-day.jpg" autoplay muted loop playsinline controls></video><h2>노을 (실제 속도)</h2><video src="seoul-dusk.mp4" poster="seoul-dusk.jpg" autoplay muted loop playsinline controls></video><h2>밤 (실제 속도)</h2><video src="seoul-night.mp4" poster="seoul-night.jpg" autoplay muted loop playsinline controls></video></main></body></html>
